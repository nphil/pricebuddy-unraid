; One supervisor for everything in the container. Startup order:
;   mariadb and scraper start at once; init waits for the database, runs upstream's
;   own start script (migrations, caches), and that script's last line starts group app.
[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[unix_http_server]
file = /run/supervisor.sock
chmod = 0700

[supervisorctl]
serverurl = unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mariadb]
command = /usr/sbin/mariadbd --user=mysql --datadir=/config/mysql --bind-address=127.0.0.1 --socket=/run/mysqld/mysqld.sock --skip-name-resolve
priority = 1
autorestart = true
stopwaitsecs = 90
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:scraper]
command = /opt/scraper/bin/python /SeleniumBase/api/server.py
directory = /SeleniumBase
environment = PATH="/opt/scraper/bin:%(ENV_PATH)s",API_HOST="127.0.0.1",API_PORT="3000",PYTHONUNBUFFERED="1"
priority = 5
autorestart = true
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:init]
command = /start-app.sh
directory = /app
priority = 10
autorestart = false
startsecs = 0
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr = true

; Upstream's three programs, as in docker/php/supervisord.conf, started by init.
[program:apache2]
command = apachectl -D "FOREGROUND" -k start
autostart = false
autorestart = true
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:cron]
command = /start-cron.sh
autostart = false
autorestart = true
stdout_logfile = /var/log/cron.log
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:queue-worker]
stopwaitsecs = 30
command = php artisan queue:work
directory = /app
autostart = false
autorestart = true
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr = true

[group:app]
programs = apache2,cron,queue-worker
