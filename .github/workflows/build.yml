name: build

# One image per PriceBuddy release, tagged with PriceBuddy's own version (v1.0.54), plus
# `latest`. A change to this repo alone rebuilds the current version as a revision
# (v1.0.54-r2). Each build publishes a GitHub Release, so Unraid's Docker tab shows the
# update and ShipLog shows the changelog.
on:
  schedule:
    - cron: "41 */6 * * *"      # look for a new PriceBuddy release four times a day
  workflow_dispatch:
    inputs:
      note:
        description: "What changed in this repo (release notes for a revision build)"
        required: false
  push:
    branches: [main]
    paths: ["Dockerfile", "rootfs/**", ".github/workflows/build.yml"]

permissions:
  contents: write
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  UPSTREAM: jez500/pricebuddy
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Decide what to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Upstream publishes git tags and Docker Hub images, not GitHub Releases.
          # Take the newest tag that already has its image on Docker Hub.
          up=""
          for t in $(gh api "repos/$UPSTREAM/tags?per_page=30" --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -rV); do
            if curl -fsS -o /dev/null "https://hub.docker.com/v2/repositories/jez500/pricebuddy/tags/$t"; then up=$t; break; fi
          done
          [ -n "$up" ] || { echo "no upstream image found"; exit 1; }
          ver=${up#v}
          ours=$(gh release list -R "$GITHUB_REPOSITORY" --limit 300 --json tagName --jq '.[].tagName' || true)
          n=$(grep -cE "^v${ver//./\\.}(-r[0-9]+)?$" <<<"$ours" || true)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$n" -gt 0 ]; then
            echo "PriceBuddy $ver already built; nothing to do"; echo "skip=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$n" -eq 0 ]; then tag="v$ver"; else tag="v$ver-r$((n + 1))"; fi
          prev=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$ours" | grep -vx "v$ver" | sort -rV | head -1 || true)
          echo "skip=false" >>"$GITHUB_OUTPUT"
          echo "ver=$ver" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "prev=$prev" >>"$GITHUB_OUTPUT"
          echo "Building $tag for PriceBuddy $ver (previous release ${prev:-none})"

      - uses: actions/checkout@v4
        if: steps.plan.outputs.skip == 'false'

      - uses: docker/setup-buildx-action@v3
        if: steps.plan.outputs.skip == 'false'

      - uses: docker/login-action@v3
        if: steps.plan.outputs.skip == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        if: steps.plan.outputs.skip == 'false'
        with:
          context: .
          push: true
          build-args: PRICEBUDDY_VERSION=v${{ steps.plan.outputs.ver }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.plan.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=PriceBuddy for Unraid
            org.opencontainers.image.description=PriceBuddy with its database and scraper, as one container
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.plan.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish release
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VER: ${{ steps.plan.outputs.ver }}
          PREV: ${{ steps.plan.outputs.prev }}
          NOTE: ${{ github.event.inputs.note }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          {
            if [ "$TAG" = "v$VER" ]; then
              echo "**PriceBuddy $VER.** Changes upstream"
              if [ -n "$PREV" ]; then
                echo "since ${PREV}:"
                echo
                # Upstream has no release notes; its merged pull requests are the changelog.
                gh api "repos/$UPSTREAM/compare/$PREV...v$VER" \
                  --jq '.commits[] | select(.commit.message | startswith("Merge pull request")) | .commit.message | split("\n") | "- " + (.[2] // .[0]) ' \
                  | sort -u || true
              else
                echo
                echo "First build of this package."
              fi
              echo
              echo "Full history: https://github.com/$UPSTREAM/commits/v$VER"
            else
              echo "**Packaging update, still PriceBuddy $VER.**"
              echo
              printf '%s\n' "${NOTE:-${HEAD_MSG:-Rebuilt from $GITHUB_SHA.}}"
            fi
          } >notes.md
          cat notes.md
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PriceBuddy $VER${TAG#v$VER}" --notes-file notes.md
